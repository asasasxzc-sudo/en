<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0c0c0e; color: #e4e4e7; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; }
        .mic-active { background: #ef4444 !important; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4">
    <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col">
        <header class="flex justify-between items-center py-6">
            <h1 class="text-xl font-bold text-indigo-500">YMTEA.VOICE</h1>
            <select id="lang" class="bg-zinc-800 rounded-lg px-3 py-1 text-sm outline-none">
                <option value="en-US">English</option>
                <option value="de-DE">Deutsch</option>
                <option value="fr-FR">Français</option>
                <option value="es-ES">Español</option>
            </select>
        </header>

        <div id="chat" class="flex-grow overflow-y-auto space-y-4 mb-6 min-h-[300px]">
            <p class="text-zinc-600 text-center mt-10">后端已就绪，请点击按钮并说话</p>
        </div>

        <div class="flex flex-col items-center gap-4 pb-10">
            <button id="mic" class="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center transition-all duration-300">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>
            <span id="status" class="text-xs text-zinc-500 font-mono tracking-widest uppercase">READY</span>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="card p-4 text-xs">
                <h3 class="text-zinc-500 mb-2 font-bold">VOCABULARY</h3>
                <div id="words" class="space-y-1"></div>
            </div>
            <div class="card p-4 text-xs">
                <h3 class="text-zinc-500 mb-2 font-bold">PHRASES</h3>
                <div id="phrases" class="text-zinc-400"></div>
            </div>
        </div>
    </div>

    <script>
    const API_URL = window.location.origin; 
    const mic = document.getElementById('mic');
    const status = document.getElementById('status');
    const chat = document.getElementById('chat');

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (Speech) {
        recognition = new Speech();
        recognition.continuous = false; // 手机端设为 false 更稳定
        recognition.interimResults = false;

        recognition.onstart = () => {
            status.innerText = "Listening...";
            mic.classList.add('pulse', 'bg-red-500'); 
        };

        recognition.onend = () => {
            mic.classList.remove('pulse', 'bg-red-500');
            if(status.innerText === "Listening...") status.innerText = "Ready";
        };

        recognition.onerror = (e) => {
            console.log("Error type:", e.error);
            if (e.error === 'aborted') {
                status.innerText = "Retry Clicking..."; 
            } else {
                status.innerText = "Error: " + e.error;
            }
        };

        recognition.onresult = async (e) => {
            const text = e.results[0][0].transcript;
            handleSend(text);
        };
    }

    // 核心：处理发送逻辑（打字或语音共用）
    async function handleSend(text) {
        if(!text) return;
        appendMsg('User', text);
        status.innerText = "Thinking...";
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, lang: document.getElementById('lang').value })
            });
            const data = await res.json();
            appendMsg('AI', data.answer);
            if(data.words) updateCards(data);
            speak(data.answer);
            status.innerText = "Ready";
        } catch (err) {
            status.innerText = "API Error";
        }
    }

    // 针对 iPad 优化的点击逻辑
    mic.onclick = () => {
    if (!recognition) return alert("浏览器不支持");

    // 1. 强制夺取音频上下文控制权 (iOS 必做)
    window.speechSynthesis.getVoices();
    const synth = window.speechSynthesis;
    const u = new SpeechSynthesisUtterance("");
    u.volume = 0;
    synth.speak(u);

    // 2. 检查状态并切换
    if (isStarted) {
        recognition.stop();
        isStarted = false;
        status.innerText = "Ready";
    } else {
        // 3. 核心：不加任何 setTimeout，直接启动
        try {
            recognition.lang = document.getElementById('lang').value;
            recognition.start();
        } catch (err) {
            // 如果启动瞬间报错，说明有残留，强行 abort 后立即重试
            recognition.abort();
            setTimeout(() => {
                recognition.start();
            }, 50);
        }
    }
};
    function appendMsg(s, t) {
        const d = document.createElement('div');
        d.className = `p-3 rounded-xl mb-2 \${s==='User'?'bg-indigo-600/20 ml-8':'bg-zinc-800 mr-8'}`;
        d.innerHTML = `<small class="block opacity-50 text-[10px]">\${s}</small>\${t}`;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(t) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = document.getElementById('lang').value;
        window.speechSynthesis.speak(u);
    }

    function updateCards(data) {
        const w = document.getElementById('words');
        if(w && data.words) w.innerHTML = data.words.map(i => `<div>\${i.word}: \${i.mean}</div>`).join('');
    }
</script>
</body>
</html>
