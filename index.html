<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0c0c0e; color: #e4e4e7; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; }
        .mic-active { background: #ef4444 !important; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4">
    <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col">
        <header class="flex justify-between items-center py-6">
            <h1 class="text-xl font-bold text-indigo-500">YMTEA.VOICE</h1>
            <select id="lang" class="bg-zinc-800 rounded-lg px-3 py-1 text-sm outline-none">
                <option value="en-US">English</option>
                <option value="de-DE">Deutsch</option>
                <option value="fr-FR">Français</option>
                <option value="es-ES">Español</option>
            </select>
        </header>

        <div id="chat" class="flex-grow overflow-y-auto space-y-4 mb-6 min-h-[300px]">
            <p class="text-zinc-600 text-center mt-10">后端已就绪，请点击按钮并说话</p>
        </div>

        <div class="flex flex-col items-center gap-4 pb-10">
            <button id="mic" class="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center transition-all duration-300">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>
            <span id="status" class="text-xs text-zinc-500 font-mono tracking-widest uppercase">READY</span>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="card p-4 text-xs">
                <h3 class="text-zinc-500 mb-2 font-bold">VOCABULARY</h3>
                <div id="words" class="space-y-1"></div>
            </div>
            <div class="card p-4 text-xs">
                <h3 class="text-zinc-500 mb-2 font-bold">PHRASES</h3>
                <div id="phrases" class="text-zinc-400"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://en.ymtea.club'; 
        const mic = document.getElementById('mic');
        const status = document.getElementById('status');
        const chat = document.getElementById('chat');

        // 关键：全局唯一的识别实例
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isStarted = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isStarted = true;
                mic.classList.add('mic-active');
                status.innerText = "LISTENING...";
            };

            recognition.onend = () => {
                isStarted = false;
                mic.classList.remove('mic-active');
                if(status.innerText === "LISTENING...") status.innerText = "READY";
            };

            recognition.onerror = (e) => {
                isStarted = false;
                mic.classList.remove('mic-active');
                status.innerText = "ERROR: " + e.error;
                // 如果报错 aborted，通常是重复启动，这里做个静默处理
                if(e.error === 'aborted') status.innerText = "READY (RESET)";
            };

            recognition.onresult = async (e) => {
                const text = e.results[0][0].transcript;
                addMsg('User', text);
                status.innerText = "THINKING...";

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text, lang: document.getElementById('lang').value })
                    });
                    const data = await res.json();
                    addMsg('AI', data.answer);
                    updateCards(data);
                    speak(data.answer);
                    status.innerText = "READY";
                } catch (err) {
                    status.innerText = "API ERROR";
                }
            };
        }

        mic.onclick = () => {
            if (!recognition) return alert("浏览器不支持");
            
            // 核心逻辑：如果正在听，就手动停止；如果没有，就启动
            if (isStarted) {
                recognition.stop();
            } else {
                recognition.lang = document.getElementById('lang').value;
                try {
                    recognition.start();
                } catch(err) {
                    // 彻底清除可能的异常状态
                    recognition.stop();
                    setTimeout(() => recognition.start(), 100);
                }
            }
        };

        function addMsg(s, t) {
            const d = document.createElement('div');
            d.className = `p-3 rounded-xl ${s==='User'?'bg-indigo-600/20 ml-8':'bg-zinc-800 mr-8'}`;
            d.innerHTML = `<small class="block text-zinc-500 text-[10px]">${s}</small>${t}`;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }

        function updateCards(data) {
            document.getElementById('words').innerHTML = (data.words||[]).map(w => `<div>${w.word}: ${w.mean}</div>`).join('');
            document.getElementById('phrases').innerHTML = (data.phrases||[]).map(p => `<p>• ${p}</p>`).join('');
        }

        function speak(t) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = document.getElementById('lang').value;
            window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>
