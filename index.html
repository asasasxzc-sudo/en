<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0c0c0e; color: #e4e4e7; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 1.5rem; }
        .mic-active { background: #ef4444 !important; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4">
    <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col">
        <header class="flex justify-between items-center py-6">
            <h1 class="text-xl font-bold text-indigo-500">YMTEA.VOICE</h1>
            <select id="lang" class="bg-zinc-800 rounded-lg px-3 py-1 text-sm outline-none">
                <option value="en-US">English</option>
                <option value="de-DE">Deutsch</option>
                <option value="fr-FR">Français</option>
                <option value="es-ES">Español</option>
            </select>
        </header>

        <div id="chat" class="flex-grow overflow-y-auto space-y-4 mb-6 min-h-[300px]">
            <p class="text-zinc-600 text-center mt-10">后端已就绪，请点击按钮并说话</p>
        </div>

        <div class="flex flex-col items-center gap-4 pb-10">
            <button id="mic" class="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center transition-all duration-300">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>
            <span id="status" class="text-xs text-zinc-500 font-mono tracking-widest uppercase">READY</span>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="card p-4 text-xs">
                <h3 class="text-zinc-500 mb-2 font-bold">VOCABULARY</h3>
                <div id="words" class="space-y-1"></div>
            </div>
            <div class="card p-4 text-xs">
                <h3 class="text-zinc-500 mb-2 font-bold">PHRASES</h3>
                <div id="phrases" class="text-zinc-400"></div>
            </div>
        </div>
    </div>

    <script>
    // 自动适配你的 Worker 地址
    const API_URL = window.location.origin; 
    const mic = document.getElementById('mic') || document.getElementById('micBtn');
    const status = document.getElementById('status');
    const chat = document.getElementById('chat');

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isStarted = false;

    if (!Speech) {
        status.innerText = "抱歉，您的浏览器不支持语音识别";
    } else {
        recognition = new Speech();
        recognition.continuous = false;
        recognition.interimResults = false;

        // 核心：处理开始录音
        recognition.onstart = () => {
            isStarted = true;
            mic.classList.add('mic-active', 'pulse'); // 增加动画反馈
            status.innerText = "正在倾听...";
        };

        // 核心：处理录音结束
        recognition.onend = () => {
            isStarted = false;
            mic.classList.remove('mic-active', 'pulse');
            if (status.innerText === "正在倾听...") status.innerText = "就绪";
        };

        // 核心：处理错误
        recognition.onerror = (e) => {
            isStarted = false;
            mic.classList.remove('mic-active', 'pulse');
            console.error("Speech Error:", e.error);
            
            if (e.error === 'not-allowed') {
                status.innerText = "错误：权限被拒绝";
                alert("请点击地址栏左侧『小锁』或『AA』图标，手动允许麦克风。");
            } else if (e.error === 'aborted') {
                status.innerText = "已重置 (RESET)";
            } else {
                status.innerText = "错误: " + e.error;
            }
        };

        // 核心：处理识别结果
        recognition.onresult = async (e) => {
            const text = e.results[0][0].transcript;
            appendMsg('User', text);
            status.innerText = "AI 思考中...";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, lang: document.getElementById('lang').value })
                });
                const data = await res.json();
                
                appendMsg('AI', data.answer);
                updateCards(data);
                speak(data.answer);
                status.innerText = "就绪";
            } catch (err) {
                status.innerText = "API 连接失败";
            }
        };
    }

    // 绑定点击事件 - 针对 iPad 优化的暴力启动逻辑
    mic.onclick = () => {
        if (!recognition) return;

        // 1. 尝试播放一个静音片段（iOS 必须先有音频交互才能解锁录音通道）
        const synth = window.speechSynthesis;
        const u = new SpeechSynthesisUtterance("");
        u.volume = 0;
        synth.speak(u);

        if (isStarted) {
            recognition.stop();
        } else {
            // 2. 先强行终止之前的实例
            try { recognition.abort(); } catch(e) {}

            // 3. 稍作延迟后再启动
            setTimeout(() => {
                try {
                    recognition.lang = document.getElementById('lang').value;
                    recognition.start();
                } catch (err) {
                    status.innerText = "启动失败，请刷新";
                }
            }, 200);
        }
    };

    function appendMsg(sender, text) {
        const div = document.createElement('div');
        div.className = `p-4 rounded-2xl ${sender === 'User' ? 'bg-indigo-600/10 ml-10 border border-indigo-500/20' : 'bg-zinc-800 mr-10 border border-white/5'}`;
        div.innerHTML = `<small class="block mb-1 text-zinc-500 text-[10px] font-bold uppercase">${sender}</small><p>${text}</p>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function updateCards(data) {
        if (data.words) {
            document.getElementById('words').innerHTML = data.words.map(w => `<div>${w.word}: ${w.mean}</div>`).join('');
        }
    }

    function speak(text) {
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = document.getElementById('lang').value;
        window.speechSynthesis.speak(ut);
    }
</script>
</body>
</html>
